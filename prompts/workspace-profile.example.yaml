workspace:
  id: "example-workspace"
  name: "Philanthropic Investment Cases"

audience:
  primary_segment: "ultra-high-net-worth donors"
  secondary_segment: "experienced and first-time domain funders"
  domain: "global health"
  indicative_commitment: "$5M+"
  decision_context: "at an event or within approximately two months"
  familiarity:
    minimum: "limited domain knowledge"
    maximum: "experienced global health funder"

document_positioning:
  type: "executive briefing"
  direct_solicitation: false
  default_length: "2–4 pages"
  default_external_formats:
    - "polished 2-4 page executive summary"
    - "longer investment case when source depth supports it"
    - "one-page opportunity spotlight for early donor conversations"
  primary_goal: >
    Help the reader recognize a credible, strategically logical and
    well-managed opportunity.

editorial_preferences:
  tone:
    - sophisticated
    - concise
    - urgent through facts
    - invitational
    - head-and-heart
  lead_with:
    - proof
    - progress
    - credible opportunity
  avoid:
    - deficit-led titles
    - tragedy framing
    - direct appeals
    - gap-filling language
    - overwritten conclusions
    - generic AI headings
  preserve:
    - all verified data
    - investment teams
    - technical teams
    - diligence spotlights

format_preferences:
  document_role: "briefing that opens a substantive conversation, not a pitch"
  section_style: "editorial judgment rather than generic AI labels"
  layout_progression:
    - "choose single-column, two-column, color, labels, and section naming from the selected template or user direction"
    - "prefer scannable modules over uninterrupted prose"
    - "keep each section doing distinct persuasive work"
  preferred_modules:
    - "opportunity thesis"
    - "impact pathway"
    - "metric callouts"
    - "geography strip"
    - "timeline"
    - "investment tier table"
    - "team and diligence panel"
    - "risk and mitigation table"
    - "engage options"
  information_needed_flags: "Use visible red INFO NEEDED callouts when required information is missing."

framing_preferences:
  donor_role: "participant and potential author of outcomes"
  philanthropy_role: "configurable; only use catalytic or first-mover framing when sourced"
  social_proof: "use only when source-backed"
  leverage_language: "use exact sourced ratios only"
  engage_style:
    - substantive briefing
    - technical discussion
    - site or lab visit
    - intellectual exploration

organization:
  co_investment_vehicle:
    name: "{{CONFIGURABLE_VEHICLE_NAME}}"
    description: "{{APPROVED_DESCRIPTION}}"

brand:
  profile: "{{SELECTED_BRAND_PROFILE}}"
  heading_font: "{{CONFIGURABLE_SERIF_FONT}}"
  body_font: "{{CONFIGURABLE_SANS_FONT}}"
  primary_color: "{{HEX}}"
  accent_color: "{{HEX}}"
  background_color: "{{HEX}}"
  available_profiles:
    proponent_labs:
      primary_color: "#428F90"
      accent_color: "#EB6056"
      neutral_color: "{{PF_GREY_HEX}}"
      light_accent_color: "{{PF_LIGHT_GREEN_HEX}}"
      notes:
        - "Use only when this brand profile is selected."
    gates_foundation:
      primary_color: "#313A44"
      accent_color: "#EBCB00"
      background_color: "#F5F3ED"
      heading_font: "Noto Serif"
      body_font: "Noto Sans"
      notes:
        - "Use only when this brand profile is selected."

contacts:
  default_contact:
    name: "{{CONTACT_NAME}}"
    title: "{{CONTACT_TITLE}}"
    email: "{{CONTACT_EMAIL}}"

benchmarks:
  approved_reference_cases:
    - "{{REFERENCE_CASE_ID}}"
  use_for:
    - "format"
    - "tone"
    - "section architecture"
  do_not_use_for:
    - "case facts"
    - "funding recipient inference"
    - "investment vehicle inference"

production_workflow:
  editable_source_format: "DOCX or app-based structured sections"
  final_share_format: "PDF generated after human review"
  qa_loop:
    - "build"
    - "validate"
    - "convert to PDF for layout preview"
    - "inspect rendered pages"

governance:
  workspace_memory_requires_admin_approval: true
  cross_case_fact_reuse: false
  show_information_needed_flags: true
