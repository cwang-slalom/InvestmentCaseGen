services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: investmentgen
      POSTGRES_USER: investmentgen
      POSTGRES_PASSWORD: investmentgen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investmentgen -d investmentgen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
