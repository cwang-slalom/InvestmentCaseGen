          - generic [ref=e144]: Every day, mothers and newborns across Sub-Saharan Africa face life-threatening complications during pregnancy, childbirth, and the postpartum period that are entirely preventable. While the clinical solutions to these complications are well-established, they are not reaching the clinics and delivery rooms where they are needed most. Essential life-saving tools, diagnostics, and medicines are available in only approximately 45% of health facilities, which are further crippled by frequent stockouts, severe understaffing, and a lack of foundational infrastructure like real-time data, functional referral pathways, and reliable emergency transport. [S4]
